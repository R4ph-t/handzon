# Local-dev Postgres for Tier 2. `pnpm dev` brings it up automatically
# via `pnpm dev:db`. If you'd rather use a hosted Postgres (Render,
# Neon, etc.), point DATABASE_URL at it in .env and skip `dev:db`.
services:
  postgres:
    image: postgres:17
    container_name: handzon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: handzon
      POSTGRES_PASSWORD: handzon
      POSTGRES_DB: handzon
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handzon"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
