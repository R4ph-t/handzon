# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# Tier 2 Blueprint — Astro SSR site + Mastra AI service + Render Postgres
# for cross-device progress sync. Grouped under a Render Project +
# production environment.
#
# To use: rename this file to render.yaml, push, and run
# "New → Blueprint" in the Render Dashboard.
#
# After first deploy, set the AI provider keys on the ai service
# (only one is required, depending on the chosen provider):
#   ANTHROPIC_API_KEY
#   OPENAI_API_KEY
#   GOOGLE_GENERATIVE_AI_API_KEY
#   OPENAI_COMPATIBLE_API_KEY (+ OPENAI_COMPATIBLE_BASE_URL)
#
# Migrations run automatically via `preDeployCommand` on the site service.

projects:
  - name: __PROJECT_NAME__
    environments:
      - name: production
        services:
          - type: web
            name: __PROJECT_NAME__-site
            runtime: node
            plan: starter
            rootDir: .
            buildCommand: pnpm install --frozen-lockfile && pnpm build
            startCommand: node ./dist/server/entry.mjs
            preDeployCommand: pnpm db:migrate
            healthCheckPath: /healthz
            envVars:
              - key: NODE_VERSION
                value: "22"
              - key: PUBLIC_PROGRESS_BACKEND
                value: remote
              - key: PUBLIC_AI_SERVICE_URL
                # Render ships the bare private-network hostname here.
                # The browser-side fetch expands it to
                # `https://<host>.onrender.com` automatically.
                fromService:
                  type: web
                  name: __PROJECT_NAME__-ai
                  property: host
              - key: DATABASE_URL
                fromDatabase:
                  name: __PROJECT_NAME__-db
                  property: connectionString
              # --- GitHub auth (optional) ---
              # Auth.js needs a stable session secret + the public site
              # URL. AUTH_TRUST_HOST tells Auth.js to trust the X-Forwarded
              # headers Render's edge sends, so callbacks resolve to the
              # public HTTPS URL instead of the internal http://host:port.
              - key: AUTH_SECRET
                generateValue: true
              - key: AUTH_TRUST_HOST
                value: "true"
              # AUTH_URL: set this to your site's public origin
              # (https://<your-domain>) post-deploy. Render doesn't expose
              # a fully-qualified-URL fromService property, so this is
              # `sync: false` — fill it in once via the Dashboard.
              - key: AUTH_URL
                sync: false
              # Create a GitHub OAuth App, then set these. Authorization
              # callback URL: <AUTH_URL>/api/auth/callback/github
              - key: GITHUB_CLIENT_ID
                sync: false
              - key: GITHUB_CLIENT_SECRET
                sync: false

          - type: web
            name: __PROJECT_NAME__-ai
            runtime: node
            plan: starter
            # Post-refactor: the AI service is the `handzon-ai` npm bin
            # shipped by the @handzon/ai package, so it lives at the
            # scaffold root alongside the site (no `services/ai/`
            # subdir anymore). `pnpm install` pulls it in; `pnpm exec
            # handzon-ai` runs the prebundled dist/server.js.
            rootDir: .
            buildCommand: pnpm install --frozen-lockfile
            startCommand: pnpm exec handzon-ai
            healthCheckPath: /healthz
            envVars:
              - key: NODE_VERSION
                value: "22"
              - key: ALLOWED_ORIGIN
                # Same hostname-expansion convention — the CORS middleware
                # turns this into `https://<host>.onrender.com`.
                fromService:
                  type: web
                  name: __PROJECT_NAME__-site
                  property: host
              - key: ANTHROPIC_API_KEY
                sync: false
              - key: OPENAI_API_KEY
                sync: false
              - key: GOOGLE_GENERATIVE_AI_API_KEY
                sync: false
              - key: OPENAI_COMPATIBLE_API_KEY
                sync: false
              - key: OPENAI_COMPATIBLE_BASE_URL
                sync: false

        databases:
          - name: __PROJECT_NAME__-db
            plan: basic-256mb
            postgresMajorVersion: "17"
