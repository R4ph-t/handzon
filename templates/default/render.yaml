# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# Tier 1 Blueprint — Render Static Site for the tutorial app + a Mastra-powered
# AI assistant Web Service, grouped under a Render Project + production
# environment. Learner progress lives in localStorage (no DB).
#
# After "New → Blueprint", set the AI provider keys on the assistant service:
#   ANTHROPIC_API_KEY (or OPENAI_API_KEY / GOOGLE_GENERATIVE_AI_API_KEY)

previews:
  generation: automatic
  expireAfterDays: 7

projects:
  - name: __PROJECT_NAME__
    environments:
      - name: production
        services:
          - type: web
            name: __PROJECT_NAME__-site
            runtime: static
            rootDir: .
            buildCommand: pnpm install --frozen-lockfile && pnpm build
            staticPublishPath: ./dist
            envVars:
              - key: NODE_VERSION
                value: "22"
              - key: PUBLIC_AI_SERVICE_URL
                fromService:
                  type: web
                  name: __PROJECT_NAME__-ai
                  property: host

          - type: web
            name: __PROJECT_NAME__-ai
            runtime: node
            plan: starter
            rootDir: services/ai
            buildCommand: pnpm install --frozen-lockfile && pnpm build
            startCommand: pnpm start
            healthCheckPath: /healthz
            envVars:
              - key: NODE_VERSION
                value: "22"
              - key: ALLOWED_ORIGIN
                fromService:
                  type: web
                  name: __PROJECT_NAME__-site
                  property: host
              - key: ANTHROPIC_API_KEY
                sync: false
              - key: OPENAI_API_KEY
                sync: false
              - key: GOOGLE_GENERATIVE_AI_API_KEY
                sync: false
              - key: OPENAI_COMPATIBLE_API_KEY
                sync: false
              - key: OPENAI_COMPATIBLE_BASE_URL
                sync: false
