# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# Tier 1 Blueprint — Render Static Site for the tutorial app + a Mastra-powered
# AI assistant Web Service. Learner progress lives in localStorage (no DB).
#
# After "New → Blueprint", set the AI provider keys on the assistant service:
#   ANTHROPIC_API_KEY (or OPENAI_API_KEY / GOOGLE_GENERATIVE_AI_API_KEY)

projects:
  - name: __PROJECT_NAME__
    environments:
      - name: production
        protected: false

services:
  - type: web
    name: __PROJECT_NAME__-site
    project:
      name: __PROJECT_NAME__
      environment: production
    runtime: static
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: PUBLIC_AI_SERVICE_URL
        fromService:
          type: web
          name: __PROJECT_NAME__-ai
          property: host
      - key: NODE_VERSION
        value: "22"

  - type: web
    name: __PROJECT_NAME__-ai
    project:
      name: __PROJECT_NAME__
      environment: production
    runtime: node
    plan: starter
    rootDir: services/ai
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /healthz
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ALLOWED_ORIGIN
        fromService:
          type: web
          name: __PROJECT_NAME__-site
          property: host
      # Author-provided AI provider keys. Set in the Render Dashboard.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: OPENAI_COMPATIBLE_API_KEY
        sync: false
      - key: OPENAI_COMPATIBLE_BASE_URL
        sync: false
