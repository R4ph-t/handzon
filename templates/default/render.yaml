# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# Tier 1 Blueprint — Astro SSR site (no Postgres) + Mastra-powered AI
# assistant. Learner progress lives in localStorage. Grouped under a
# Render Project + production environment.
#
# After "New → Blueprint", set the AI provider keys on the assistant
# service (only one is required, depending on the chosen provider):
#   ANTHROPIC_API_KEY
#   OPENAI_API_KEY
#   GOOGLE_GENERATIVE_AI_API_KEY
#   OPENAI_COMPATIBLE_API_KEY (+ OPENAI_COMPATIBLE_BASE_URL)
#
# GitHub sign-in is NOT available on Tier 1 — it needs Postgres for the
# users/accounts/sessions tables. Use render.full.yaml (Tier 2) if you
# want learners to sign in.

previews:
  generation: automatic
  expireAfterDays: 7

projects:
  - name: __PROJECT_NAME__
    environments:
      - name: production
        services:
          - type: web
            name: __PROJECT_NAME__-site
            runtime: node
            plan: starter
            rootDir: .
            buildCommand: pnpm install --frozen-lockfile && pnpm build
            startCommand: node ./dist/server/entry.mjs
            healthCheckPath: /healthz
            envVars:
              - key: NODE_VERSION
                value: "22"
              - key: PUBLIC_AI_SERVICE_URL
                # Render ships the bare private-network hostname here.
                # The browser-side fetch expands it to
                # `https://<host>.onrender.com` automatically.
                fromService:
                  type: web
                  name: __PROJECT_NAME__-ai
                  property: host

          - type: web
            name: __PROJECT_NAME__-ai
            runtime: node
            plan: starter
            rootDir: services/ai
            buildCommand: pnpm install --frozen-lockfile && pnpm build
            startCommand: pnpm start
            healthCheckPath: /healthz
            envVars:
              - key: NODE_VERSION
                value: "22"
              - key: ALLOWED_ORIGIN
                # Same hostname-expansion convention — the CORS middleware
                # turns this into `https://<host>.onrender.com`.
                fromService:
                  type: web
                  name: __PROJECT_NAME__-site
                  property: host
              - key: ANTHROPIC_API_KEY
                sync: false
              - key: OPENAI_API_KEY
                sync: false
              - key: GOOGLE_GENERATIVE_AI_API_KEY
                sync: false
              - key: OPENAI_COMPATIBLE_API_KEY
                sync: false
              - key: OPENAI_COMPATIBLE_BASE_URL
                sync: false
